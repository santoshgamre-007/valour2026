<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D2E">
<title>Valour 2026 — Overall points</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#0F3D2E; --pitch-2:#145239; --bg:#EDF1EE; --paper:#FFFFFF; --ink:#13201B; --mute:#5B6963; --line:#D5DCD7; --soft:#F4F7F5;
  --amber:#FFB300; --amber-ink:#5A3E00; --red:#C62839; --green:#1E8E5A;
  --num:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--num);margin:0;letter-spacing:.2px}
h2{font-size:22px;color:var(--pitch)} h3{font-size:17px;color:var(--pitch)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--pitch)}
input[type=color]{padding:2px;height:40px;width:52px}
:focus-visible{outline:3px solid rgba(255,179,0,.75);outline-offset:2px}
label{display:block;font-weight:600;font-size:13px;color:var(--mute);margin:12px 0 4px}
.muted{color:var(--mute);font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:700 17px var(--num);letter-spacing:.3px;background:var(--pitch);color:#fff}
.btn.amber{background:var(--amber);color:var(--amber-ink)}
.btn.ghost{background:#fff;color:var(--pitch);box-shadow:inset 0 0 0 1.5px var(--pitch)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* header + tabs */
.hd{background:var(--pitch);color:#fff;padding:16px 18px 14px}
.hd-in{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.hd .t{font:800 32px/1 var(--num);letter-spacing:.4px}
.hd .s{font-size:13px;opacity:.85;margin-top:5px}
.hd .sync{font-size:12px;opacity:.8;text-align:right;max-width:260px}
nav{background:var(--pitch-2);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.25)}
nav .in{max-width:980px;margin:0 auto;display:flex;gap:4px;padding:6px 10px;overflow:auto}
nav button{flex:0 0 auto;border:0;background:transparent;color:#fff;border-radius:8px;padding:8px 14px;font:700 18px var(--num);opacity:.75}
nav button.on{background:var(--amber);color:var(--amber-ink);opacity:1}
main{max-width:980px;margin:0 auto;padding:16px 14px 70px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 150px}.row>.auto{flex:0 0 auto}

/* the race: lanes */
.hero h1{font:800 clamp(34px,7vw,50px)/1 var(--num);color:var(--pitch)}
.hero .sub{margin:8px 0 0;color:var(--mute)}
.prog{height:6px;border-radius:3px;background:var(--line);margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pitch);transition:width .6s ease}
.lanes{margin-top:14px}
.lane{display:grid;grid-template-columns:34px 122px 1fr;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed #C6D0CA}
.lane:first-child{border-top:0}
.lane .rk{font:800 30px/1 var(--num);color:var(--pitch);text-align:center}
.lane .nm{font:700 18px/1.05 var(--num);overflow-wrap:normal;word-break:normal}
.track{position:relative;height:32px;border-radius:16px;background:#E3EAE5}
.fill{position:absolute;inset:0 auto 0 0;width:var(--w);min-width:32px;border-radius:16px;background:var(--c);box-shadow:inset 0 0 0 3px var(--c2,#13201B);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.val{position:absolute;top:50%;transform:translateY(-50%);left:calc(max(var(--w),32px) + 8px);font:800 20px var(--num);white-space:nowrap}
.champ{display:flex;gap:28px;flex-wrap:wrap;background:var(--amber);color:var(--amber-ink);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.champ .l{font-size:13px;font-weight:600}
.champ .b1{font:800 38px/1 var(--num)}.champ .b2{font:800 28px/1.1 var(--num);margin-top:6px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid #E8EDEA;vertical-align:middle}
.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.std td.rk{font:800 24px var(--num);color:var(--pitch);width:34px}
.std tr.r1 td:first-child{box-shadow:inset 5px 0 0 var(--amber)}
.std tr.r2 td:first-child{box-shadow:inset 5px 0 0 #9AA7A1}
.std .pts{font:800 22px var(--num)}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2.5px var(--c2,#13201B);margin-right:9px;vertical-align:-2px}
.tag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--amber);color:var(--amber-ink)}
.tag.sil{background:#DDE3E0;color:#33403A}
.mx td.c{text-align:center;font-variant-numeric:tabular-nums}
.mx td.lead{font-weight:800;box-shadow:inset 0 -3px 0 var(--amber)}
.mx tfoot td{font-weight:800;border-top:2px solid var(--line)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:4px}

/* events */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters>div{flex:1 1 160px}.filters label{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-weight:600;font-size:14px}
.seg button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ev{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px}
.ev.done{border-left-color:var(--green)}.ev.wip{border-left-color:var(--amber)}
.ev .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev .sp{font:800 24px/1.05 var(--num);color:var(--pitch)}
.ev .cg{color:var(--mute);font-size:13px;margin-top:2px}
.ev .g{display:grid;gap:6px;margin-top:10px}
.cell{position:relative;background:var(--soft);border-radius:6px;padding:11px 7px 5px;min-width:0}
.cell::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;border-radius:6px 6px 0 0;background:var(--c);box-shadow:inset 0 0 0 2px var(--c2,rgba(19,32,27,.7))}
.cell .tn{display:block;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell b{font:800 22px/1.1 var(--num)}
.cell i{font-style:normal;font-size:11.5px;color:var(--mute);margin-left:5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:#E3E8E5;color:#3A4741}
.pill.done{background:var(--green);color:#fff}.pill.wip{background:var(--amber);color:var(--amber-ink)}
.pill.no{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,25,19,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-bottom:2px}
.trow select.auto{font-style:italic;color:var(--mute);background:#F1F5F2}
.trow{display:grid;grid-template-columns:1fr 96px 96px;gap:8px;align-items:center;margin-top:8px;padding-left:16px;position:relative}
.gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 58px 14px 58px minmax(0,1fr);gap:6px;align-items:center;padding:7px 0;border-top:1px solid #E8EDEA}
.fx .fa{text-align:right;font-weight:700}.fx .fb{font-weight:700}.fx span.vs{text-align:center;color:var(--mute)}
.fx input.sc{text-align:center;padding:8px 2px}
.fx .fw{grid-column:1/-1;background:#FFF4D6;border-radius:8px;padding:6px 10px}.fx .fw label{margin:0 0 4px}
.fwhen{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--mute);margin-top:-3px}
.fe{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);gap:8px;align-items:center;padding:10px 0;border-top:1px solid #E8EDEA}
.fe .vs{text-align:center;color:var(--mute)}.fe .when{grid-column:1/-1}.fe select{padding:9px 8px}
.fe .fe-b{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.fe.add{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px}
.fx.fm{display:block;padding:12px 0}
.fm-h{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:8px;align-items:center}
.fm-h .res{text-align:center;font:800 24px var(--num);color:var(--pitch)}
.fm-sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.fm-sets .st{min-width:0}.fm-sets .st .muted{display:block;font-size:12px;margin-bottom:2px}
.fm-sets .sp{display:flex;gap:4px;align-items:center}.fm-sets .sp span{color:var(--mute)}
.fm-sets input.sc{width:100%;min-width:0;padding:8px 2px;text-align:center}
.fm-r{margin-top:8px;font-size:13.5px;color:var(--mute);text-align:center}.fm-r b{color:var(--green)}
.trow.w4{grid-template-columns:minmax(0,1fr) 58px 84px 70px}.trow.w3{grid-template-columns:minmax(0,1fr) 72px 92px}
.trow.w4 input,.trow.w4 select,.trow.w3 input{padding:9px 6px}
.ap{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid #E8EDEA}
.game h3{font-size:18px}
.mdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px #13201B;margin-right:6px;vertical-align:-1px}
.mrow{display:grid;grid-template-columns:62px 1fr 118px;gap:8px;align-items:center;margin-top:8px;padding-left:16px;position:relative}
.mrow .tn{font:700 18px var(--num)}
.mrow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 2px var(--c2,rgba(19,32,27,.7))}
.cell .mn{display:block;font:700 15px/1.2 var(--body);overflow-wrap:anywhere}
.cell .mn+i{display:block;margin:2px 0 0}
.trow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 2px var(--c2,rgba(19,32,27,.7))}
.trow .tn{font:700 18px var(--num)}
.chk{display:flex;gap:9px;align-items:center;font-weight:600;color:var(--ink);font-size:14px;margin:12px 0 0}
.cs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cs label{margin:6px 0 0}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.acts .btn{flex:1 1 auto}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw;font-weight:600}
.warn{background:#FFF4D6;border:1px solid #F0D58A;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips span{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px}
@media(max-width:520px){.std .bh{display:none}.std td,.std th{padding:8px 4px}.mx th{font-size:11.5px;padding:6px 3px}.mx td{padding:8px 3px}.filters>div{flex:1 1 100%}.lane{grid-template-columns:26px 98px 1fr}.lane .nm{font-size:15.5px}.hd .t{font-size:28px}.trow{grid-template-columns:1fr 84px 84px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in"><div><div class="t" id="hd-title">Valour 2026</div><div class="s">Overall points · Vakil Satellite Township · v1.7.2</div></div><div class="sync" id="sync">Starting…</div></div></header>
<nav><div class="in"><button data-tab="board" class="on">Leaderboard</button><button data-tab="events">Events</button><button data-tab="games">Team games</button><button data-tab="settings">Settings</button></div></nav>
<main>
  <section id="tab-board"></section>
  <section id="tab-events" hidden></section>
  <section id="tab-games" hidden></section>
  <section id="tab-settings" hidden></section>
</main>
<div id="ov" class="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ================= data ================= */
const KEY = 'valour2026.points';
const DOC = 'valour2026-points';
const FIREBASE = { apiKey: 'AIzaSyDjLDhsyrpnZVBrSBU9obHA2KFaYkAyqvU', authDomain: 'velour2026-b8385.firebaseapp.com', projectId: 'velour2026-b8385', storageBucket: 'velour2026-b8385.firebasestorage.app', messagingSenderId: '553829591792', appId: '1:553829591792:web:9e6fed2a369c1eddaeb035' };

const uid = () => Math.random().toString(36).slice(2, 9);
const MEDAL_NAMES = ['Gold', 'Silver', 'Bronze'], MEDAL_COLORS = ['#E5B422', '#C3C9CD', '#B9743A'];
function medalOnly(sport) { return /^(rummy|athletics)$/i.test(String(sport || '').trim()); } // participation games: medals only, no team points
const blankMedals = () => [0, 1, 2].map(() => ({ name: '', team: '' }));
const ORD = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];
const COLORS = ['#2F6DB5', '#D9472B', '#7A4FB5', '#0E9AA7', '#B8860B', '#C2185B', '#455A64', '#6D4C41'];
// Official team colours. Applied by team name unless a colour was picked by hand in Settings.
// Colours sampled from the four team jerseys: main colour + accent.
const TEAM_COLORS = { dhurandhar: { c: '#111111', c2: '#C6151A' }, spartans: { c: '#FFFFFF', c2: '#1351AD' }, vipers: { c: '#F6EBD2', c2: '#F2853C' }, mavericks: { c: '#FBD722', c2: '#D50619' } };
function teamColorFor(name) { const k = String(name || '').toLowerCase(); for (const key in TEAM_COLORS) if (k.includes(key)) return TEAM_COLORS[key]; return null; }
const OLD_AUTO = ['#f3e3b5', '#ffd500'];
const isDefaultColor = (c) => { const x = String(c || '').toLowerCase(); return !x || COLORS.some((d) => d.toLowerCase() === x) || OLD_AUTO.includes(x) || Object.values(TEAM_COLORS).some((v) => v.c.toLowerCase() === x); };
const isDefaultColor2 = (c) => { const x = String(c || '').toLowerCase(); return !x || x === '#13201b' || Object.values(TEAM_COLORS).some((v) => v.c2.toLowerCase() === x); };
const fmt = (n) => (n == null ? '–' : String(Math.round(n * 10) / 10));

// The schedule exactly as in "Valour 26 - Schedule.xlsx": [stage, category, sport]
const SCHEDULE = [
  ['League + Finals', 'Sr Citizen', 'Rummy'], ['Leagues', 'Above 50', 'Carroms'], ['Friendly Matches (18+)', 'Above 18', 'Basketball'],
  ['League + Finals', 'Below 13', 'Athletics'], ['Leagues', 'Below 18', 'Throwball'], ['League + Finals', 'Above 50', 'Carroms'],
  ['Leagues', "Women's", 'Cricket'], ['Leagues', 'Junior', 'Cricket'], ['Leagues', 'Below 18', 'Basketball'], ['Leagues', "Men's", 'Cricket'],
  ['Leagues', "Women's", 'Throwball'], ['Finals', "Men's", 'Cricket'], ['Finals', 'Junior', 'Cricket'], ['Leagues', 'All Ages', 'TT'],
  ['Leagues', "Men's", 'Volleyball'], ['League + Finals', 'All Ages', 'TT'], ['Finals', 'Below 18', 'Basketball'], ['League + Finals', 'All Ages', 'Badminton'],
  ['SF + Finals', 'All Ages', 'Badminton'], ['League + Finals', 'Below 18', 'Football'], ['Finals', "Women's", 'Throwball'], ['Finals', 'Below 18', 'Throwball'],
  ['Finals', "Men's", 'Volleyball'], ['Finals', "Women's", 'Cricket'],
];
function defaults() {
  return {
    name: 'Valour 2026',
    teams: [1, 2, 3, 4].map((i) => ({ id: 't' + i, name: 'Team ' + i, color: COLORS[i - 1] })),
    scheme: [50, 25, 15, 10, 10, 10, 10, 10], // Gold, Silver, Bronze, 4th (participation) and below; editable in Settings
    events: SCHEDULE.map((r, i) => ({ id: 'e' + (i + 1), stage: r[0], category: r[1], sport: r[2], kind: medalOnly(r[2]) ? 'medals' : /friendly/i.test(r[0]) ? 'friendly' : 'points', medals: blankMedals(), counts: true, done: false, pts: {}, place: {}, wins: {}, scheme: null, note: '' })),

function norm(t) {
  t.teams = (t.teams || []).map((x, i) => { const kn = teamColorFor(x.name); return { id: x.id || 't' + uid(), name: x.name || 'Team ' + (i + 1), color: (kn && isDefaultColor(x.color) ? kn.c : x.color) || COLORS[i % COLORS.length], color2: (kn && isDefaultColor2(x.color2) ? kn.c2 : x.color2) || '#13201B' }; });
  t.scheme = Array.from({ length: 8 }, (_, i) => (t.scheme && t.scheme[i] != null ? +t.scheme[i] : 0));
  t.events = (t.events || []).map((e) => ({ id: e.id || 'e' + uid(), stage: e.stage || '', category: e.category || '', sport: e.sport || '', kind: ['medals', 'points', 'friendly'].includes(e.kind) ? e.kind : (medalOnly(e.sport) ? 'medals' : /friendly/i.test(e.stage) ? 'friendly' : 'points'), medals: [0, 1, 2].map((i) => ({ name: (e.medals && e.medals[i] && e.medals[i].name) || '', team: (e.medals && e.medals[i] && e.medals[i].team) || '' })), counts: e.counts !== false, done: !!e.done, pts: e.pts || {}, place: e.place || {}, scheme: Array.isArray(e.scheme) ? e.scheme : null, wins: e.wins && typeof e.wins === 'object' ? e.wins : {}, note: e.note || '' }));
  // one-time update (schema 2): friendly matches give no points
  if (!(t.schema >= 2)) t.events.forEach((ev) => { if (ev.kind === 'points' && /friendly/i.test(ev.stage)) ev.kind = 'friendly'; });
  const nn = (v, d) => (v === '' || v == null || isNaN(+v) ? d : +v);
  const oldWin = t.leaguePts && t.leaguePts.win; t.leaguePts = { win: nn(oldWin, 5) };
  // one-time update (schema 3): 5 points for a league match won; 35 / 25 / 15 / 10 for 1st to 4th
  if (!(t.schema >= 3)) { if (oldWin == null || +oldWin === 2) t.leaguePts.win = 5; if ([5, 3, 2, 1].every((v, i) => +t.scheme[i] === v)) t.scheme = [35, 25, 15, 10, 10, 10, 10, 10]; }
  // one-time update (schema 4): the Final winner earns 50 (was 35)
  if (!(t.schema >= 4) && [35, 25, 15, 10].every((v, i) => +t.scheme[i] === v)) t.scheme = [50, 25, 15, 10, 10, 10, 10, 10];

function load() { try { const s = localStorage.getItem(KEY); if (s) return norm(JSON.parse(s)); } catch (_) {} return norm(defaults()); }
let T = load();
const UI = { tab: 'board', sport: '', status: 'all', fx: {} };

/* ================= scoring maths ================= */
const num = (v) => (v === '' || v == null || isNaN(+v) ? null : +v);

// Placings left blank are worked out from the points: highest points = 1st, equal points share a placing.
const hasLeague = (e) => /league/i.test(e.stage || ''), hasFinal = (e) => /final/i.test(e.stage || ''), isLeagueOnly = (e) => hasLeague(e) && !hasFinal(e);
function effPlaces(ev) {
  if (isLeagueOnly(ev)) return {}; // league matches give points, never medals
  const out = {}; const withP = T.teams.filter((t) => evPts(ev, t.id) != null);
  const distinct = new Set(withP.map((t) => evPts(ev, t.id))).size > 1;
  T.teams.forEach((t) => { if (ev.place[t.id]) out[t.id] = ev.place[t.id]; else if (distinct && evPts(ev, t.id) != null) out[t.id] = 1 + withP.filter((o) => evPts(ev, o.id) > evPts(ev, t.id)).length; });
  return out;
}
const schemeFor = (ev, place) => { const s = ev && ev.scheme ? ev.scheme : T.scheme; return s[place - 1] == null ? 0 : s[place - 1]; };
const canEdit = () => !!scorerPin();
const team = (id) => T.teams.find((t) => t.id === id) || { name: '?', color: '#888' };

// Ranking: total points, then most 1st places, then 2nd, then 3rd. A full tie is left for the organisers to settle.
function calc() {
  const rows = T.teams.map((t) => ({ id: t.id, name: t.name, color: t.color, color2: t.color2, pts: 0, g: 0, s: 0, b: 0 }));
  const R = Object.fromEntries(rows.map((r) => [r.id, r]));
  const seq = [];
  T.events.forEach((ev) => {
    if (!ev.counts || noPts(ev) || evState(ev) === 'todo') return;
    seq.push(ev);
    const EP = effPlaces(ev); T.teams.forEach((t) => { const p = evPts(ev, t.id); if (p != null) R[t.id].pts += p; const pl = EP[t.id]; if (pl === 1) R[t.id].g++; else if (pl === 2) R[t.id].s++; else if (pl === 3) R[t.id].b++; });
  });
  const same = (a, b) => a.pts === b.pts && a.g === b.g && a.s === b.s && a.b === b.b;
  const order = rows.slice().sort((a, b) => b.pts - a.pts || b.g - a.g || b.s - a.s || b.b - a.b || a.name.localeCompare(b.name));
  order.forEach((r, i) => { const p = order[i - 1]; r.rank = p && same(p, r) ? p.rank : i + 1; r.tied = order.some((o) => o !== r && same(o, r)); r.countback = order.some((o) => o !== r && o.pts === r.pts && !same(o, r)); });
  const counted = T.events.filter((e) => e.counts && !noPts(e));
  return { rows: order, seq, counted: counted.length, done: counted.filter((e) => e.done).length, left: counted.filter((e) => !e.done) };
}

/* ================= cloud (same Firebase project + scorer PIN as the cricket app) ================= */
const FB = { db: null, ref: null, ready: false, synced: false, applying: false, remoteUpdated: 0 };
function scorerPin() { try { return localStorage.getItem(KEY + '.pin') || localStorage.getItem('velour2026.cricket.pin') || ''; } catch (_) { return ''; } }
function setSync(msg) { const el = $('sync'); if (el) el.textContent = msg; }
const clock = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

async function pushNow() {
  try { await FB.ref.set({ json: JSON.stringify(T), updated: T.updated, pin: scorerPin() }); FB.remoteUpdated = T.updated; setSync('Cloud · scorer · saved ' + clock()); return true; }
  catch (e) { const denied = /permission|denied/i.test(String((e && e.code) || e)); setSync(denied ? 'Cloud rejected the save — wrong scorer PIN' : 'Sync error — check internet'); if (denied) toast('Wrong scorer PIN — changes are not reaching the cloud'); console.error(e); return false; }
}
async function cloudInit() {
  try {
    setSync('Connecting to cloud…');
    for (const src of ['https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js', 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'])
      await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    const app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(FIREBASE);
    FB.db = window.firebase.firestore(app); FB.ready = true; FB.ref = FB.db.collection('tournaments').doc(DOC);

    const snap = await FB.ref.get(); const d = snap.exists ? snap.data() : null;
    if (d && d.json) {
      const remote = norm(JSON.parse(d.json)); FB.remoteUpdated = remote.updated || 0;
      if (!canEdit() || !T.updated || (remote.updated || 0) >= T.updated) adopt(remote);
      else await pushNow();
    } else if (canEdit()) { T.updated = T.updated || Date.now(); try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (_) {} await pushNow(); }
    FB.synced = true;
    FB.ref.onSnapshot((sn) => { const x = sn.data(); if (!x || !x.json) return; const remote = norm(JSON.parse(x.json)); FB.remoteUpdated = remote.updated || 0; if ((remote.updated || 0) > (T.updated || 0)) { FB.applying = true; adopt(remote); FB.applying = false; } });
    if (!/rejected|Sync error/.test($('sync').textContent)) setSync(canEdit() ? 'Cloud · scorer · in sync ' + clock() : 'Cloud · view only — enter the scorer PIN in Settings to edit');
    if (UI.tab === 'settings' && $('ov').hidden) render();
  } catch (e) { setSync('Cloud connection failed — check internet'); console.error(e); }
}
let cloudTimer = null;
function cloudSave() {
  if (FB.applying) return;
  if (!FB.ready || !FB.synced) { if (canEdit()) setSync('Saved on this phone — waiting for the cloud connection'); return; }
  if (!canEdit()) { setSync('Not saved to cloud — enter the scorer PIN in Settings'); return; }
  clearTimeout(cloudTimer); cloudTimer = setTimeout(() => { pushNow(); }, 600);
}
async function pullNow() {
  if (!FB.ready) { toast('Not connected to the cloud yet'); return; }
  try { const snap = await FB.ref.get(); const d = snap.exists ? snap.data() : null; if (!d || !d.json) { toast('There is no cloud copy yet'); return; } if (!confirm('Replace the data on this phone with the copy in the cloud?')) return; adopt(norm(JSON.parse(d.json))); toast('Loaded from the cloud'); } catch (e) { toast('Could not reach the cloud'); }
}
async function sendNow() {
  if (!FB.ready) { toast('Not connected to the cloud yet'); return; }
  if (!confirm('Replace the copy in the cloud with the data on this phone? Everyone will then see this phone\'s data.')) return;
  T.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (_) {} FB.synced = true;
  if (await pushNow()) { render(); toast('Sent to the cloud'); }
}

function persist() { T.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (_) {} cloudSave(); }

/* ================= leaderboard ================= */
function raceChart(rows) {
  const { seq } = calc();
  if (seq.length < 2) return '<div class="muted" style="padding:10px 0">The race chart appears once two events have points.</div>';
  const cw = Math.max(300, Math.min((($('tab-board') && $('tab-board').clientWidth) || 700) - 34, 820)); const lab = (t, v) => Math.min(t.name.length, 14) + 1 + String(fmt(v)).length; const longest = Math.max(...T.teams.map((t) => lab(t, rows.find((r) => r.id === t.id).pts)));
  const W = cw, H = 300, L = 36, R = Math.min(200, Math.round(38 + 8 * longest)), Tp = 14, B = 46;
  const cum = T.teams.map((t) => { let s = 0; return [0].concat(seq.map((ev) => (s += evPts(ev, t.id) || 0))); });
  const maxV = Math.max(1, ...cum.map((c) => c[c.length - 1])); const step = maxV <= 10 ? 2 : maxV <= 25 ? 5 : maxV <= 60 ? 10 : 20; const top = Math.ceil(maxV / step) * step;
  const x = (i) => L + (W - L - R) * i / seq.length, y = (v) => Tp + (H - Tp - B) * (1 - v / top);
  let g = ''; for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E1E7E3"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#5B6963">${v}</text>`;
  const every = Math.ceil(seq.length / 12); let xl = ''; seq.forEach((ev, i) => { if ((i + 1) % every === 0 || i === seq.length - 1) xl += `<text x="${x(i + 1)}" y="${H - 26}" text-anchor="middle" font-size="12" fill="#5B6963">${i + 1}</text>`; });
  const ends = T.teams.map((t, k) => ({ t, k, yy: y(cum[k][cum[k].length - 1]) })).sort((a, b) => a.yy - b.yy); for (let i = 1; i < ends.length; i++) if (ends[i].yy - ends[i - 1].yy < 19) ends[i].yy = ends[i - 1].yy + 19;
  const lines = T.teams.map((t, k) => { const pts = cum[k].map((v, i) => x(i) + ',' + y(v)).join(' '); return `<polyline fill="none" stroke="${t.color2}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/><polyline fill="none" stroke="${t.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>`; }).join('');
  const dots = T.teams.map((t, k) => `<circle cx="${x(seq.length)}" cy="${y(cum[k][seq.length])}" r="6" fill="${t.color}" stroke="${t.color2}" stroke-width="2.6"/>`).join('');
  const labels = ends.map((e) => `<circle cx="${W - R + 14}" cy="${e.yy}" r="5.5" fill="${e.t.color}" stroke="${e.t.color2}" stroke-width="2.4"/><text x="${W - R + 25}" y="${e.yy + 5}" font-size="13.5" font-weight="700" fill="#13201B">${esc(e.t.name.length > 14 ? e.t.name.slice(0, 13) + '…' : e.t.name)} ${fmt(cum[e.k][seq.length])}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative points after each scored event: ${esc(rows.map((r) => r.name + ' ' + fmt(r.pts)).join(', '))}">${g}${xl}${lines}${dots}${labels}<text x="${L}" y="${H - 5}" font-size="12" fill="#5B6963">Events scored, in schedule order</text></svg>`;
}

  const data = sports.map((sp) => { const sums = T.teams.map(() => 0); let any = false; T.events.forEach((ev) => { if (ev.sport !== sp || !ev.counts || noPts(ev) || evState(ev) === 'todo') return; any = true; T.teams.forEach((t, i) => { sums[i] += evPts(ev, t.id) || 0; }); }); return { sp, sums, any }; });

  const { rows } = calc(); const tot = Object.fromEntries(rows.map((r) => [r.id, r.pts]));
  const out = [['#', 'Stage', 'Category', 'Sport', 'Type', 'Counts', 'Status'].concat(T.teams.map((t) => t.name), MEDAL_NAMES)];
  T.events.forEach((e, i) => out.push([i + 1, e.stage, e.category, e.sport, e.kind === 'medals' ? 'Medals only' : e.kind === 'friendly' ? 'Friendly' : 'Team points', noPts(e) ? 'No' : e.counts ? 'Yes' : 'No', STATE_LABEL[evState(e)]].concat(T.teams.map((t) => (noPts(e) || evPts(e, t.id) == null ? '' : evPts(e, t.id))), e.medals.map((m) => (m.name ? m.name + (m.team ? ' (' + team(m.team).name + ')' : '') : '')))));
  out.push(['', '', '', 'Total', '', '', ''].concat(T.teams.map((t) => tot[t.id]), ['', '', '']));
  return '\ufeff' + out.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
}
function typedReset(msg, fn) {
  if (!confirm(msg + '\n\nA backup file is downloaded first. Continue?')) return;
  const w = prompt('Type RESET to confirm.'); if (w === null || w.trim().toUpperCase() !== 'RESET') { toast('Nothing was changed'); return; }
  download('valour2026_points_backup.json', JSON.stringify(T, null, 2), 'application/json'); fn(); save(); toast('Done');
}

/* ================= clicks ================= */
document.addEventListener('click', (e) => {
  const evb = e.target.closest('[data-ev]'); if (evb && evb.classList.contains('ev')) { openEditor(evb.dataset.ev); return; }
  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
  if (act === 'close') closeModal();
  else if (act === 'pull') pullNow();
  else if (act === 'send') sendNow();
  else if (act === 'new-event') openEditor(null);
  else if (act === 'declare') declareDialog();
  else if (act === 'undeclare') { if (confirm('Remove the declared result?')) { T.final = null; save(); } }
  else if (act === 'del-event') { const id = $('sheet').dataset.ev; const ev = T.events.find((x) => x.id === id); if (ev && confirm('Delete ' + ev.sport + ' · ' + ev.category + ' · ' + ev.stage + '?')) { T.events = T.events.filter((x) => x.id !== id); closeModal(); save(); toast('Event deleted'); } }
  else if (act === 'save-pin') { const v = $('pin').value.trim(); if (!v) { toast('Enter the PIN first'); return; } localStorage.setItem(KEY + '.pin', v); toast('PIN saved — reloading'); setTimeout(() => location.reload(), 700); }
  else if (act === 'clear-pin') { localStorage.removeItem(KEY + '.pin'); toast('PIN removed from this app'); setTimeout(() => location.reload(), 700); }
  else if (act === 'add-team') { if (T.teams.length >= 8) return; const n = T.teams.length + 1; T.teams.push({ id: 't' + uid(), name: 'Team ' + n, color: COLORS[(n - 1) % COLORS.length], color2: '#13201B' }); save(); }
  else if (act === 'del-team') { const id = a.dataset.id; if (!confirm('Remove ' + team(id).name + ' and its points?')) return; T.teams = T.teams.filter((t) => t.id !== id); T.events.forEach((ev) => { delete ev.pts[id]; delete ev.place[id]; }); Object.values(T.tourneys).forEach((tr) => { tr.matches = tr.matches.filter((m) => m.a !== id && m.b !== id); if (tr.finalists && tr.finalists.includes(id)) tr.finalists = null; }); if (T.final && (T.final.winner === id || T.final.runner === id)) T.final = null; save(); }
  else if (act === 'save-scheme') { document.querySelectorAll('[data-scheme]').forEach((i) => { T.scheme[+i.dataset.scheme] = num(i.value) || 0; }); const lw = document.querySelector('[data-lw]'); if (lw && num(lw.value) != null) T.leaguePts.win = num(lw.value); const tr = $('third-rule'); if (tr) T.thirdRule = tr.value === 'level' ? 'level' : 'always'; save(); toast('Points saved'); }
  else if (act.startsWith('gm-')) gameAct(act, a);
  else if (act === 'save-name') { T.name = $('tname').value.trim() || 'Valour 2026'; save(); toast('Saved'); }
  else if (act === 'csv') download('valour2026_points.csv', csvText(), 'text/csv');
  else if (act === 'backup') download('valour2026_points_backup.json', JSON.stringify(T, null, 2), 'application/json');
  else if (act === 'restore') $('restore-file').click();
  else if (act === 'reset-scores') typedReset('This clears every placing and point, the declared result, and the scored flags. Events and teams stay.', () => { T.events.forEach((ev) => { ev.pts = {}; ev.place = {}; ev.done = false; }); T.final = null; });
  else if (act === 'reset-all') typedReset('This replaces all events with the original Valour 26 schedule and clears all points.', () => { T.events = norm(defaults()).events; T.final = null; });
});

render();
cloudInit();
</script>
